  <body>
    <main class="app" id="app" data-session-state="idle">
      <section class="display">
        <svg viewBox="0 0 116 116" role="img" aria-label="Breathing indicator">
          <circle
            id="ring-backdrop"
            class="ring-backdrop"
            cx="58"
            cy="58"
            r="40"
          />
          <circle class="ring-track" cx="58" cy="58" r="40" />
          <g id="ticks" class="ticks"></g>
          <circle id="ring" cx="58" cy="58" r="40" />
          <circle id="dot" cx="58" cy="10" r="3.5" />
        </svg>
        <div class="overlay">
          <p id="phase-label" aria-live="polite">Ready</p>
          <p id="countdown" aria-hidden="true"></p>
          <p id="session-stats"></p>
        </div>
        <div class="display-toggles">
          <button
            id="sound-toggle"
            class="icon-toggle"
            type="button"
            aria-label="Sound"
            aria-pressed="true"
            title="Sound"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 9h4l5-4v14l-5-4H4z" />
              <path
                class="sound-waves"
                d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"
              />
            </svg>
          </button>
          <button
            id="theme-toggle"
            class="icon-toggle"
            type="button"
            aria-label="Night mode"
            aria-pressed="false"
            title="Night mode"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20.5 14.6A8.5 8.5 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z" />
            </svg>
          </button>
        </div>
      </section>

      <section class="summary" aria-label="Session results">
        <p id="summary-stats"></p>
        <ol id="rounds" aria-live="polite"></ol>
      </section>

      <div class="controls" role="group" aria-label="Session controls">
        <div class="breathe-in-row">
          <button id="breathe-in" type="button">Breathe in</button>
        </div>
        <div class="preset-control pattern-control">
          <label for="preset-select">Breathing pattern</label>
          <div class="stepper">
            <button
              id="preset-prev"
              class="step"
              type="button"
              aria-label="Previous pattern"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M14.5 6l-6 6 6 6" />
              </svg>
            </button>
            <select id="preset-select"></select>
            <button
              id="preset-next"
              class="step"
              type="button"
              aria-label="Next pattern"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9.5 6l6 6-6 6" />
              </svg>
            </button>
          </div>
        </div>
        <label class="preset-control" for="tempo-select">
          <span>Tempo</span>
          <select id="tempo-select"></select>
        </label>
        <label
          class="preset-control breath-retention-only"
          for="breaths-select"
        >
          <span>Breaths</span>
          <select id="breaths-select"></select>
        </label>
        <button id="start" type="button">Start</button>
        <button id="pause" type="button">Pause</button>
        <button id="resume" type="button">Resume</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </main>
  </body>
</html>
